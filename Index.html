  const tshirts = 1000 / mkm;
  const dashcam = 1200 / mkm;
  const aitp = pcf.aitp === 'Yes' ? 30000 / mkm : 0;

  // Per-trip → per km
  const rk = rtKms || 1;
  const isbt = 590 * (parseInt(pcf.isbt)||0) * 2 / rk;
  const water = 500 / rk;
  const laundry = 400 / rk;
  const parking = 500 / rk;
  const hpTax = pcf.hpTax === 'Yes' ? 1700 / rk : 0;

  // D/H salary
  const drivers = pcf.dhModel === '2D1H' ? 2 : 1;
  const dhPerKm = (drivers * 25000 + 15000) / mkm;

  // Toll & state tax
  const toll = pcf.tollRoute === '__custom__' ? (parseFloat(pcf.customToll)||0) : (TOLL_ROUTES[pcf.tollRoute]||0);
  const stateTax = parseFloat(pcf.stateTax) || (STATE_TAXES[pcf.fuelState]||0);

  const items = [
    { label:'EMI/km', value:emiPerKm, group:'capital' },
    { label:'Fuel/km', value:fuelPerKm, group:'operating' },
    { label:'AdBlue/km', value:1, group:'operating' },
    { label:'Tyres/km', value:1, group:'operating' },
    { label:'Insurance/km', value:insurancePerKm, group:'capital' },
    { label:'S&M/km', value:1.3, group:'overhead' },
    { label:'Admin/km', value:0.3, group:'overhead' },
    { label:'Misc/km', value:0.8, group:'overhead' },
    { label:'D/H Salary/km', value:dhPerKm, group:'staffing' },
    { label:'Delhi MCD/km', value:delhiMCD, group:'regulatory' },
    { label:'AITP/km', value:aitp, group:'regulatory' },
    { label:'State Tax/km', value:stateTax, group:'regulatory' },
    { label:'HP Tax/km', value:hpTax, group:'regulatory' },
    { label:'ISBT/km', value:isbt, group:'regulatory' },
    { label:'Toll/km', value:toll, group:'route' },
    { label:'Parking/km', value:parking, group:'route' },
    { label:'Water/km', value:water, group:'route' },
    { label:'Laundry/km', value:laundry, group:'route' },
    { label:'Liasoning/km', value:liasoning, group:'overhead' },
    { label:'Tshirts/km', value:tshirts, group:'overhead' },
    { label:'Dashcam/km', value:dashcam, group:'overhead' },
  ];
  const total = items.reduce((s,x) => s+x.value, 0);
  const challan = total * 0.01;
  const pc = total + challan;
  return { pc, total, challan, items };
}

function calcWAMG(lines, region, mode) {
  const f = lines.filter(l => {
    if (l._removed) return false;
    if (region !== 'All' && l.region !== region) return false;
    if (mode === 'live' && l.status !== 'Live') return false;
    return l.mg && l.contractedKms;
  });
  const tot = f.reduce((s, l) => s + l.contractedKms, 0);
  return tot > 0 ? f.reduce((s, l) => s + l.mg * l.contractedKms, 0) / tot : null;
}

function App() {
  const [mode, setMode] = useState('live');
  const [tab, setTab] = useState('baseline');

  const [search, setSearch] = useState('');
  const [fReg, setFReg] = useState('All');
  const [fStat, setFStat] = useState('All');
  const [sortCol, setSortCol] = useState('name');
  const [sortDir, setSortDir] = useState('asc');
  const [modal, setModal] = useState(null);
  const [form, setForm] = useState({});
  const [result, setResult] = useState(null);
  const [extraLines, setExtraLines] = useState([]);
  const [addModal, setAddModal] = useState(null); // null | 'single' | 'bulk'
  const [addForm, setAddForm] = useState({});
  const [bulkText, setBulkText] = useState('');
  const [bulkError, setBulkError] = useState('');
  const fileRef = useRef(null);

  const LINES = useMemo(() => [...BASE_LINES, ...extraLines], [extraLines]);

  const effLines = useMemo(() => LINES.map(l => {
    const c = changes[l._id];
    if (!c) return l;
    if (c.type === 'remove') return { ...l, _removed: true };
    if (c.type === 'renegotiate') return { ...l, mg: c.newMg, _simType: 'renegotiate', _origMg: l.mg };
    if (c.type === 'repurpose') {
      const nc = l.vehicles * l.rtYear * c.newRtKms;
      return { ...l, name: c.newName, mg: c.newMg, pc: c.newPc, rtKms: c.newRtKms, contractedKms: nc, _simType: 'repurpose' };
    }
    return l;
  }), [changes]);

  const hasC = Object.keys(changes).length > 0;

  const baseMG = { India: calcWAMG(LINES,'All',mode), North: calcWAMG(LINES,'North',mode), South: calcWAMG(LINES,'South',mode), West: calcWAMG(LINES,'West',mode) };
  const simMG = hasC ? { India: calcWAMG(effLines,'All',mode), North: calcWAMG(effLines,'North',mode), South: calcWAMG(effLines,'South',mode), West: calcWAMG(effLines,'West',mode) } : null;

  const rows = useMemo(() => {
    let src = tab === 'baseline' ? LINES : effLines;
    if (mode === 'live') src = src.filter(l => l.status === 'Live');
    if (fReg !== 'All') src = src.filter(l => l.region === fReg);
    if (fStat !== 'All') src = src.filter(l => l.status === fStat);
    if (search) {
      const q = search.toLowerCase();
      src = src.filter(l => l.name.toLowerCase().includes(q) || l.partner.toLowerCase().includes(q) || (l.code||'').toLowerCase().includes(q));
    }
    const withDiff = src.map(l => ({ ...l, _diff: l.mg != null && l.pc != null ? l.mg - l.pc : null }));
    return withDiff.sort((a, b) => {
      let av = a[sortCol], bv = b[sortCol];
      if (typeof av === 'string') av = av.toLowerCase();
      if (typeof bv === 'string') bv = bv.toLowerCase();
      av = av ?? -Infinity; bv = bv ?? -Infinity;
      return sortDir === 'asc' ? (av > bv ? 1 : -1) : (av < bv ? 1 : -1);
    });
  }, [tab, effLines, mode, fReg, fStat, search, sortCol, sortDir]);

  function sort(col) {
    if (sortCol === col) setSortDir(d => d === 'asc' ? 'desc' : 'asc');
    else { setSortCol(col); setSortDir('asc'); }
  }
  function SI({ col }) {
    return <span style={{ opacity: sortCol === col ? 1 : 0.3, marginLeft: 2 }}>{sortCol !== col ? '↕' : sortDir === 'asc' ? '↑' : '↓'}</span>;
  }

  const CORRIDORS = { 'IN01':'Punjab / JK / Chandigarh', 'IN02':'Himachal Pradesh', 'IN03':'Uttarakhand', 'IN04':'Uttar Pradesh', 'IN05':'Madhya Pradesh', 'IN06':'Rajasthan', 'IN10':'Rajasthan–Uttarakhand' };
  function corridorOf(code) { return code ? code.substring(0,4).toUpperCase() : null; }

  function getSuggestions(src) {
    // build a map of which bus types run on each line (by name)
    const lineTypesMap = {};
    LINES.forEach(l => { if(!lineTypesMap[l.name]) lineTypesMap[l.name]=new Set(); lineTypesMap[l.name].add(l.busType); });
    const srcCorridor = corridorOf(src.code);

    return LINES
      .filter(l => l._id !== src._id && !l._removed && l.mg && l.pc && l.name !== src.name)
      .map(l => {
        let score = 0; const reasons = [];
        // 1. Same partner
        if (l.partner === src.partner) { score += 4; reasons.push({ label:'Same Partner', color:'#1d4ed8', bg:'#dbeafe' }); }
        // 2. Bus type already runs on that line
        if (lineTypesMap[l.name]?.has(src.busType)) { score += 3; reasons.push({ label:`${src.busType} runs here`, color:'#065f46', bg:'#d1fae5' }); }
        // 3. Same corridor
        const lCorridor = corridorOf(l.code);
        if (srcCorridor && lCorridor && srcCorridor === lCorridor) { score += 3; reasons.push({ label:`Same corridor (${CORRIDORS[srcCorridor]||srcCorridor})`, color:'#5b21b6', bg:'#ede9fe' }); }
        // 4. MG < PC on candidate (healthy line)
        if (l.mg < l.pc) { score += 2; reasons.push({ label:'MG < PC ✅', color:'#166534', bg:'#dcfce7' }); }
        // 5. Moving to lower MG line (net reduction)
        if (src.mg > l.mg) { score += 2; reasons.push({ label:`Lower MG (${l.mg.toFixed(1)} vs ${src.mg.toFixed(1)})`, color:'#92400e', bg:'#fef3c7' }); }
        // 6. Similar RT KMs ±25%
        if (Math.abs(l.rtKms - src.rtKms) / src.rtKms <= 0.25) { score += 1; reasons.push({ label:'Similar distance', color:'#374151', bg:'#f3f4f6' }); }
        // 7. Penalty if saturated
        const busesOnLine = LINES.filter(x=>x.name===l.name).reduce((s,x)=>s+x.vehicles,0);
        if (busesOnLine >= 4) score -= 2;
        return { ...l, _score: score, _reasons: reasons, _busesOnLine: busesOnLine };
      })
      .filter(l => l._score > 0)
      .sort((a,b) => b._score - a._score)
      .slice(0, 5);
  }

  function openModal(line, action) {
    const orig = LINES.find(l => l._id === line._id);
    setModal({ line: orig, action });
    setForm({ newMg: orig.mg ?? '', newPc: orig.pc ?? '', newRtKms: orig.rtKms ?? '', newName: orig.name ?? '', pcSrc: 'manual', pick: '', showManual: false });
    setResult(null);
  }

  function apply() {
    const { line, action } = modal;
    const nc = { ...changes };
    if (action === 'remove') {
      nc[line._id] = { type: 'remove' };
    } else if (action === 'renegotiate') {
      const v = parseFloat(form.newMg); if (isNaN(v)) return;
      nc[line._id] = { type: 'renegotiate', newMg: v };
    } else {
      const mg = parseFloat(form.newMg), pc = parseFloat(form.newPc), rt = parseFloat(form.newRtKms);
      if (isNaN(mg)||isNaN(pc)||isNaN(rt)) return;
      nc[line._id] = { type: 'repurpose', newMg: mg, newPc: pc, newRtKms: rt, newName: form.newName || line.name };
    }
    const nxt = LINES.map(l => {
      const c = nc[l._id]; if (!c) return l;
      if (c.type==='remove') return {...l,_removed:true};
      if (c.type==='renegotiate') return {...l,mg:c.newMg};
      const nkm = l.vehicles*l.rtYear*c.newRtKms;
      return {...l,name:c.newName,mg:c.newMg,pc:c.newPc,rtKms:c.newRtKms,contractedKms:nkm};
    });
    const imp = {};
    ['India','North','South','West'].forEach(r => {
      const reg = r==='India'?'All':r;
      const before = calcWAMG(effLines, reg, mode);
      const after  = calcWAMG(nxt, reg, mode);
      imp[r] = { before, after, delta: before!=null&&after!=null ? after-before : null };
    });
    setChanges(nc);
    setResult({ imp });
  }

  function undo(id) { const nc={...changes}; delete nc[id]; setChanges(nc); }
  function clearAll() { setChanges({}); setResult(null); setModal(null); }

  function addSingleLine() {
    const f = addForm;
    const veh=parseInt(f.vehicles), rty=parseInt(f.rtYear), rtk=parseFloat(f.rtKms), pc=parseFloat(f.pc), mg=parseFloat(f.mg);
    if (!f.name||!f.partner||isNaN(veh)||isNaN(rty)||isNaN(rtk)||isNaN(pc)||isNaN(mg)) { setBulkError('Please fill all required fields.'); return; }
    const newId = Date.now();
    const contractedKms = veh * rty * rtk;
    setExtraLines(prev => [...prev, { _id:newId, _added:true, status:f.status||'Signed', code:f.code||null, name:f.name, partner:f.partner, vehicles:veh, region:f.region||'North', busType:f.busType||'Sleeper', rtKms:rtk, rtYear:rty, contractedKms, pc, mg }]);
    setAddModal(null); setAddForm({}); setBulkError('');
  }

  function parseBulkCSV(text) {
    const lines = text.trim().split('\n').filter(l=>l.trim());
    const results = [], errors = [];
    const HEADERS = ['status','code','name','partner','vehicles','region','busType','rtKms','rtYear','pc','mg'];
    lines.forEach((line, i) => {
      if (i===0 && line.toLowerCase().includes('status')) return; // skip header row
      const cols = line.split(',').map(c=>c.trim().replace(/^"|"$/g,''));
      if (cols.length < 9) { errors.push(`Row ${i+1}: not enough columns`); return; }
      const [status,code,name,partner,vehicles,region,busType,rtKms,rtYear,pc,mg] = cols;
      const veh=parseInt(vehicles), rty=parseInt(rtYear||rtKms), rtk=parseFloat(busType||rtKms);
      // try positional mapping
      const v2=parseInt(cols[4]), rty2=parseInt(cols[8]), rtk2=parseFloat(cols[7]), pc2=parseFloat(cols[9]), mg2=parseFloat(cols[10]||cols[9]);
      if (!cols[2]||!cols[3]||isNaN(v2)||isNaN(rty2)||isNaN(rtk2)||isNaN(pc2)) { errors.push(`Row ${i+1}: missing/invalid data — ${line.substring(0,60)}`); return; }
      const contractedKms = v2 * rty2 * rtk2;
      results.push({ _id:Date.now()+i, _added:true, status:cols[0]||'Signed', code:cols[1]||null, name:cols[2], partner:cols[3], vehicles:v2, region:cols[5]||'North', busType:cols[6]||'Sleeper', rtKms:rtk2, rtYear:rty2, contractedKms, pc:pc2, mg:isNaN(parseFloat(cols[10]))?null:parseFloat(cols[10]) });
    });
    return { results, errors };
  }

  const INP = { width:'100%', padding:'8px 12px', borderRadius:6, border:'1px solid #d1d5db', fontSize:13 };

  return (
    <div style={{ fontFamily:'Inter,system-ui,sans-serif', background:'#f8fafc', minHeight:'100vh', color:'#1e293b', fontSize:13 }}>

      {/* STICKY HEADER */}
      <div style={{ background:'#0f172a', padding:'12px 20px', position:'sticky', top:0, zIndex:100, boxShadow:'0 2px 10px rgba(0,0,0,.4)' }}>
        <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:12 }}>
          <div style={{ display:'flex', alignItems:'center', gap:10 }}>
            <span style={{ background:'#73d13d', color:'#0f172a', fontWeight:900, fontSize:14, padding:'3px 10px', borderRadius:4 }}>FLIX</span>
            <span style={{ color:'#f1f5f9', fontWeight:700, fontSize:15 }}>Network Simulation Tool</span>
            <span style={{ color:'#475569', fontSize:11 }}>India Network · {hasC ? `${Object.keys(changes).length} sim active` : 'Baseline'}</span>
          </div>
          <div style={{ display:'flex', alignItems:'center', gap:8 }}>
            <div style={{ display:'flex', gap:4, background:'#1e293b', borderRadius:6, padding:3 }}>
              <span style={{ fontSize:10, color:'#475569', fontWeight:700, padding:'4px 8px', textTransform:'uppercase', letterSpacing:.5 }}>Sort:</span>
              <button onClick={()=>{ setSortCol('_diff'); setSortDir(sortCol==='_diff'&&sortDir==='asc'?'desc':'asc'); }} style={{ padding:'4px 12px', borderRadius:4, border:'none', cursor:'pointer', fontSize:12, fontWeight:600, background:sortCol==='_diff'?'#f59e0b':'transparent', color:sortCol==='_diff'?'#0f172a':'#64748b' }}>
                MG−PC {sortCol==='_diff'?(sortDir==='asc'?'↑':'↓'):'↕'}
              </button>
              <button onClick={()=>{ setSortCol('partner'); setSortDir(sortCol==='partner'&&sortDir==='asc'?'desc':'asc'); }} style={{ padding:'4px 12px', borderRadius:4, border:'none', cursor:'pointer', fontSize:12, fontWeight:600, background:sortCol==='partner'?'#f59e0b':'transparent', color:sortCol==='partner'?'#0f172a':'#64748b' }}>
                Partner {sortCol==='partner'?(sortDir==='asc'?'A→Z':'Z→A'):'A↔Z'}
              </button>
            </div>
            <div style={{ display:'flex', gap:4, background:'#1e293b', borderRadius:6, padding:3 }}>
              {[['live','Live Only'],['both','Live + Signed']].map(([v,l]) => (
                <button key={v} onClick={() => setMode(v)} style={{ padding:'4px 14px', borderRadius:4, border:'none', cursor:'pointer', fontSize:12, fontWeight:600, background:mode===v?'#3b82f6':'transparent', color:mode===v?'#fff':'#64748b' }}>{l}</button>
              ))}
            </div>
          </div>
        </div>
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr 1fr', gap:10 }}>
          {[{k:'India',l:'🇮🇳 India'},{k:'North',l:'North'},{k:'South',l:'South'},{k:'West',l:'West'}].map(({k,l}) => {
            const base = baseMG[k], sim = simMG?.[k], disp = sim??base, delta = sim!=null&&base!=null ? sim-base : null;
            return (
              <div key={k} style={{ background:'#1e293b', borderRadius:8, padding:'10px 14px', borderLeft:`3px solid ${RCOLORS[k]}` }}>
                <div style={{ fontSize:10, color:'#475569', fontWeight:700, textTransform:'uppercase', letterSpacing:.5, marginBottom:4 }}>{l} WA MG</div>
                <div style={{ fontSize:22, fontWeight:800, color:'#f1f5f9', lineHeight:1 }}>{disp!=null?`₹${disp.toFixed(2)}`:'—'}</div>
                {delta!=null && <div style={{ fontSize:11, fontWeight:700, color:delta<0?'#4ade80':'#f87171', marginTop:3 }}>{delta>=0?'▲ +':'▼ '}{Math.abs(delta).toFixed(2)} vs baseline</div>}
                {delta==null && disp!=null && <div style={{ fontSize:10, color:'#334155', marginTop:3 }}>Baseline</div>}
                {disp==null && <div style={{ fontSize:10, color:'#334155', marginTop:3 }}>No data yet</div>}

        </div>
      </div>

      {/* TABS */}
      <div style={{ display:'flex', background:'#0f172a', borderBottom:'1px solid #1e293b', padding:'0 20px' }}>
        {[['baseline','Baseline Network'],['simulation',`Simulation Zone${hasC?` (${Object.keys(changes).length})`:''}` ]].map(([id,label]) => (

            <span style={{ fontSize:12, color:'#92400e', fontWeight:600 }}>{Object.keys(changes).length} simulated change{Object.keys(changes).length>1?'s':''} active — header reflects simulation</span>
            <button onClick={clearAll} style={{ padding:'4px 12px', borderRadius:5, border:'1px solid #f59e0b', background:'#fff', color:'#92400e', cursor:'pointer', fontSize:12, fontWeight:600 }}>Clear All</button>
          </div>
        )}

        {/* FILTERS */}
        <div style={{ display:'flex', gap:10, marginBottom:14, alignItems:'center', flexWrap:'wrap' }}>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search line, partner, code…" style={{ padding:'7px 12px', borderRadius:6, border:'1px solid #e2e8f0', fontSize:12, minWidth:200 }} />
          <select value={fReg} onChange={e=>setFReg(e.target.value)} style={{ padding:'7px 10px', borderRadius:6, border:'1px solid #e2e8f0', fontSize:12, background:'#fff' }}>
            <option value="All">All Regions</option>
            {['North','South','West'].map(r=><option key={r}>{r}</option>)}
          </select>
          <select value={fStat} onChange={e=>setFStat(e.target.value)} style={{ padding:'7px 10px', borderRadius:6, border:'1px solid #e2e8f0', fontSize:12, background:'#fff' }}>
            <option value="All">All Statuses</option>
            <option>Live</option><option>Signed</option>

          <span style={{ fontSize:11, color:'#94a3b8' }}>{rows.length} lines{extraLines.length>0?` (${extraLines.length} added)`:''}</span>
          <div style={{ marginLeft:'auto', display:'flex', gap:6 }}>
            <button onClick={()=>{setAddModal('single');setAddForm({status:'Signed',region:'North',busType:'Sleeper'});setBulkError('');}} style={{ padding:'6px 14px', borderRadius:6, border:'1px solid #3b82f6', background:'#eff6ff', color:'#1d4ed8', cursor:'pointer', fontSize:12, fontWeight:600 }}>+ Add Line</button>
            <button onClick={()=>{setAddModal('bulk');setBulkText('');setBulkError('');}} style={{ padding:'6px 14px', borderRadius:6, border:'1px solid #7c3aed', background:'#f5f3ff', color:'#5b21b6', cursor:'pointer', fontSize:12, fontWeight:600 }}>⬆ Bulk Import</button>
            {extraLines.length>0&&<button onClick={()=>setExtraLines([])} style={{ padding:'6px 10px', borderRadius:6, border:'1px solid #e2e8f0', background:'#fff', color:'#64748b', cursor:'pointer', fontSize:12 }}>Clear Added</button>}
          </div>
        </div>

        {tab==='simulation'&&!hasC && (
          <div style={{ background:'#f0f9ff', border:'1px solid #bae6fd', borderRadius:6, padding:'8px 14px', fontSize:11, color:'#0369a1', marginBottom:12 }}>
            💡 Use <strong>Repurpose</strong>, <strong>Renegotiate</strong>, or <strong>Remove</strong> on any line below. The MG tiles update live.
          </div>
        )}

        {/* TABLE */}
        <div style={{ overflowX:'auto' }}>
          <table style={{ width:'100%', borderCollapse:'collapse', background:'#fff', borderRadius:8, overflow:'hidden', boxShadow:'0 1px 4px rgba(0,0,0,.07)' }}>
            <thead>
              <tr style={{ background:'#f1f5f9' }}>
                {tab==='simulation'&&<th style={TH}>Change</th>}
                <th style={TH} onClick={()=>sort('status')}>Status <SI col="status"/></th>
                <th style={TH} onClick={()=>sort('code')}>Code <SI col="code"/></th>
                <th style={{...TH,minWidth:180}} onClick={()=>sort('name')}>Line Name <SI col="name"/></th>
                <th style={TH} onClick={()=>sort('partner')}>Partner <SI col="partner"/></th>
                <th style={{...TH,textAlign:'center'}} onClick={()=>sort('vehicles')}>Buses <SI col="vehicles"/></th>
                <th style={TH} onClick={()=>sort('busType')}>Type <SI col="busType"/></th>
                <th style={{...TH,textAlign:'right'}} onClick={()=>sort('rtKms')}>RT KMs <SI col="rtKms"/></th>
                <th style={{...TH,textAlign:'right'}} onClick={()=>sort('contractedKms')}>Contr. KMs <SI col="contractedKms"/></th>
                <th style={{...TH,textAlign:'right'}} onClick={()=>sort('pc')}>PC/km <SI col="pc"/></th>
                <th style={{...TH,textAlign:'right'}} onClick={()=>sort('mg')}>MG/km <SI col="mg"/></th>
                <th style={{...TH,textAlign:'right'}} onClick={()=>sort('_diff')}>MG−PC <SI col="_diff"/></th>

                const diff = line._diff ?? (line.mg!=null&&line.pc!=null ? line.mg-line.pc : null);
                const pct = diff!=null&&line.pc ? (diff/line.pc)*100 : null;
                return (

                            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:'2px 12px' }}>
                              {est.items.map(item=>(
                                <div key={item.label} style={{ display:'flex', justifyContent:'space-between', fontSize:11, padding:'2px 0', borderBottom:'1px dotted #f1f5f9' }}>
                                  <span style={{ color:'#64748b' }}>
                                    <span style={{ display:'inline-block', padding:'1px 5px', borderRadius:8, fontSize:9, fontWeight:700, background:GRP_COLOR[item.group], color:GRP_TEXT[item.group], marginRight:4 }}>{item.group}</span>
                                    {item.label}
                                  </span>
                                  <span style={{ fontWeight:600, color:'#1e293b' }}>₹{item.value.toFixed(3)}</span>
                                </div>
                              ))}
                            </div>
                            <div style={{ display:'flex', justifyContent:'space-between', marginTop:8, paddingTop:6, borderTop:'2px solid #e2e8f0' }}>
                              <span style={{ fontSize:12, fontWeight:700 }}>Total/km</span>
                              <span style={{ fontSize:12, fontWeight:700 }}>₹{est.total.toFixed(2)}</span>
                            </div>
                            <div style={{ display:'flex', justifyContent:'space-between', marginTop:2 }}>
                              <span style={{ fontSize:11, color:'#64748b' }}>+ Challan (1%)</span>
                              <span style={{ fontSize:11, color:'#64748b' }}>₹{est.challan.toFixed(2)}</span>
                            </div>
                            <div style={{ display:'flex', justifyContent:'space-between', marginTop:6, padding:'8px 10px', background:'#1e293b', borderRadius:6 }}>
                              <span style={{ fontSize:13, fontWeight:800, color:'#f1f5f9' }}>PC/km</span>
                              <span style={{ fontSize:16, fontWeight:800, color:'#73d13d' }}>₹{est.pc.toFixed(2)}</span>
                            </div>
                          </div>
                          <button onClick={()=>setForm(f=>({...f, newPc:String(est.pc.toFixed(2))}))} style={{ width:'100%', marginTop:10, padding:'8px', borderRadius:6, border:'none', background:'#3b82f6', color:'#fff', cursor:'pointer', fontSize:12, fontWeight:700 }}>
                            ✓ Use ₹{est.pc.toFixed(2)} as PC/km
                          </button>
                          {form.newPc&&<div style={{ marginTop:6, fontSize:11, textAlign:'center', color:'#16a34a', fontWeight:600 }}>✅ PC set to ₹{parseFloat(form.newPc).toFixed(2)}</div>}
                        </>
                      )}
                      {!est&&<div style={{ fontSize:11, color:'#94a3b8', marginTop:4 }}>Fill Chassis OEM, Body Builder and Fuel State to see estimate.</div>}
                    </div>
                  </div>
                  );
                })()}

                {/* RT KMs — editable, pre-filled if pick */}
                <div style={{ marginBottom:14 }}>
                  <label style={LBL}>Round Trip KMs {form.pcSrc==='pick'&&form.newRtKms?'(auto-filled — edit if needed)':''}</label>
                  <input type="number" step="0.1" placeholder="e.g. 800" value={form.newRtKms} onChange={e=>setForm(f=>({...f,newRtKms:e.target.value}))} style={{...INP,borderColor:form.pcSrc==='pick'&&form.newRtKms?'#3b82f6':'#d1d5db'}}/>
                  {form.newRtKms&&!isNaN(parseFloat(form.newRtKms))&&(
                    <div style={{ fontSize:10, color:'#64748b', marginTop:3 }}>
                      New Contracted KMs: {((modal.line.vehicles*modal.line.rtYear*parseFloat(form.newRtKms))/1000).toFixed(0)}K
                      &nbsp;({modal.line.vehicles} bus × {modal.line.rtYear} RT/yr × {parseFloat(form.newRtKms).toFixed(1)} km)
                    </div>
                  )}
                </div>

                {/* MG INPUT — toggle between per-km or round trip total */}
                <div style={{ marginBottom:6 }}>
                  <label style={LBL}>MG Input Mode</label>
                  <div style={{ display:'flex', gap:4, background:'#f1f5f9', borderRadius:6, padding:3, marginBottom:10, width:'fit-content' }}>
                    {[['perkm','MG / km'],['rtotal','Round Trip MG (₹)']].map(([v,l])=>(
                      <button key={v} onClick={()=>setForm(f=>({...f,mgMode:v,newMg:'',rtMg:''}))} style={{ padding:'4px 14px', borderRadius:4, border:'none', cursor:'pointer', fontSize:12, fontWeight:600, background:(form.mgMode||'perkm')===v?'#3b82f6':'transparent', color:(form.mgMode||'perkm')===v?'#fff':'#64748b' }}>{l}</button>
                    ))}
                  </div>
                  {(form.mgMode||'perkm')==='perkm'?(
                    <div>
                      <input type="number" step="0.01" placeholder="e.g. 58.00" value={form.newMg} onChange={e=>setForm(f=>({...f,newMg:e.target.value}))} style={INP}/>
                      {form.newMg&&form.newRtKms&&!isNaN(parseFloat(form.newMg))&&!isNaN(parseFloat(form.newRtKms))&&(
                        <div style={{ fontSize:10, color:'#64748b', marginTop:3 }}>
                          Round Trip MG = ₹{(parseFloat(form.newMg)*parseFloat(form.newRtKms)).toFixed(0)}
                        </div>
                      )}
                    </div>
                  ):(
                    <div>
                      <input type="number" step="1" placeholder="e.g. 46400" value={form.rtMg||''} onChange={e=>{
                        const rt=parseFloat(form.newRtKms);
                        const rtmg=parseFloat(e.target.value);
                        setForm(f=>({...f,rtMg:e.target.value,newMg:rt&&!isNaN(rtmg)?String((rtmg/rt).toFixed(4)):''}));
                      }} style={INP}/>
                      {form.rtMg&&form.newRtKms&&!isNaN(parseFloat(form.rtMg))&&!isNaN(parseFloat(form.newRtKms))&&parseFloat(form.newRtKms)>0&&(
                        <div style={{ fontSize:10, color:'#0369a1', marginTop:3, background:'#f0f9ff', padding:'4px 8px', borderRadius:4 }}>
                          ÷ {parseFloat(form.newRtKms).toFixed(1)} RT km → MG/km = ₹{(parseFloat(form.rtMg)/parseFloat(form.newRtKms)).toFixed(2)}
                        </div>
                      )}
                      {(!form.newRtKms||isNaN(parseFloat(form.newRtKms)))&&<div style={{ fontSize:10, color:'#dc2626', marginTop:3 }}>⚠️ Enter RT KMs above first</div>}
                    </div>
                  )}
                  {form.newMg&&form.newPc&&!isNaN(parseFloat(form.newMg))&&!isNaN(parseFloat(form.newPc))&&(
                    <div style={{ fontSize:11, marginTop:6, color:parseFloat(form.newMg)<=parseFloat(form.newPc)?'#16a34a':'#dc2626' }}>
                      {parseFloat(form.newMg)<=parseFloat(form.newPc)?'✅':'⚠️'} MG−PC: ₹{(parseFloat(form.newMg)-parseFloat(form.newPc)).toFixed(2)} ({(((parseFloat(form.newMg)-parseFloat(form.newPc))/parseFloat(form.newPc))*100).toFixed(1)}%)
                    </div>
                  )}
                </div>

                <div style={{ display:'flex', gap:8, justifyContent:'flex-end', marginTop:20 }}>
                  <button onClick={()=>setForm(f=>({...f,showManual:false,_pickedSugg:null}))} style={CBN}>← Back to Suggestions</button>
                  <button onClick={()=>setModal(null)} style={{...CBN,marginLeft:'auto'}}>Cancel</button>
                  <button onClick={apply} style={OBN}>Apply &amp; See Impact</button>
                </div>
                </>
                )}
                </>
                );
              })()
            )}

            {result&&(
              <>
                <div style={{ fontWeight:700, fontSize:13, marginBottom:10 }}>📊 Impact on Weighted Avg MG</div>
                <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr 1fr', gap:8, marginBottom:20 }}>
                  {Object.entries(result.imp).map(([r,{before,after,delta}])=>(
                    <div key={r} style={{ background:delta<0?'#f0fdf4':delta>0?'#fef2f2':'#f8fafc', borderRadius:8, padding:'10px 12px', border:`1px solid ${delta<0?'#bbf7d0':delta>0?'#fecaca':'#e2e8f0'}` }}>
                      <div style={{ fontSize:10, fontWeight:700, color:'#64748b', textTransform:'uppercase', marginBottom:4 }}>{r}</div>
                      <div style={{ fontSize:18, fontWeight:800, color:delta<0?'#16a34a':delta>0?'#dc2626':'#94a3b8' }}>
                        {delta!=null?(delta>=0?'▲ +':'▼ ')+Math.abs(delta).toFixed(2):'—'}
                      </div>
                      {after!=null&&<div style={{ fontSize:10, color:'#94a3b8', marginTop:2 }}>₹{after.toFixed(2)} (was {before!=null?'₹'+before.toFixed(2):'—'})</div>}
                      {after==null&&<div style={{ fontSize:10, color:'#94a3b8', marginTop:2 }}>No data</div>}
                    </div>
                  ))}
                </div>
                <div style={{ display:'flex', gap:8, justifyContent:'flex-end' }}>
                  <button onClick={()=>{setResult(null);setModal(null);}} style={OBN}>Done</button>
                </div>
              </>
            )}
          </div>
        </div>
      )}

      {/* ADD SINGLE LINE MODAL */}
      {addModal==='single'&&(
        <div onClick={e=>{if(e.target===e.currentTarget)setAddModal(null)}} style={{ position:'fixed', inset:0, background:'rgba(0,0,0,.5)', zIndex:200, display:'flex', alignItems:'center', justifyContent:'center', padding:20 }}>
          <div style={{ background:'#fff', borderRadius:12, padding:28, width:560, maxWidth:'100%', boxShadow:'0 20px 60px rgba(0,0,0,.3)', maxHeight:'90vh', overflowY:'auto' }}>
            <div style={{ fontSize:16, fontWeight:800, color:'#0f172a', marginBottom:16 }}>➕ Add New Line</div>
            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12, marginBottom:12 }}>
              <div style={{ gridColumn:'1/-1' }}>
                <label style={LBL}>Line Name *</label>
                <input value={addForm.name||''} onChange={e=>setAddForm(f=>({...f,name:e.target.value}))} placeholder="e.g. Delhi - Jaipur" style={INP}/>
              </div>
              <div style={{ gridColumn:'1/-1' }}>
                <label style={LBL}>Bus Partner *</label>
                <input value={addForm.partner||''} onChange={e=>setAddForm(f=>({...f,partner:e.target.value}))} placeholder="e.g. Vivek Travels" style={INP}/>
              </div>
              <div>
                <label style={LBL}>Status</label>
                <select value={addForm.status||'Signed'} onChange={e=>setAddForm(f=>({...f,status:e.target.value}))} style={{...INP,background:'#fff'}}>
                  <option>Live</option><option>Signed</option>
                </select>
              </div>
              <div>
                <label style={LBL}>Region</label>
                <select value={addForm.region||'North'} onChange={e=>setAddForm(f=>({...f,region:e.target.value}))} style={{...INP,background:'#fff'}}>
                  <option>North</option><option>South</option><option>West</option>
                </select>
              </div>
              <div>
                <label style={LBL}>Bus Type</label>
                <select value={addForm.busType||'Sleeper'} onChange={e=>setAddForm(f=>({...f,busType:e.target.value}))} style={{...INP,background:'#fff'}}>
                  <option>Sleeper</option><option>Seater</option><option>Hybrid</option>
                </select>
              </div>
              <div>
                <label style={LBL}>Line Code</label>
                <input value={addForm.code||''} onChange={e=>setAddForm(f=>({...f,code:e.target.value}))} placeholder="e.g. IN0999" style={INP}/>
              </div>
              <div>
                <label style={LBL}>Vehicles *</label>
                <input type="number" min="1" value={addForm.vehicles||''} onChange={e=>setAddForm(f=>({...f,vehicles:e.target.value}))} placeholder="e.g. 2" style={INP}/>
              </div>
              <div>
                <label style={LBL}>RT KMs *</label>
                <input type="number" step="0.1" value={addForm.rtKms||''} onChange={e=>setAddForm(f=>({...f,rtKms:e.target.value}))} placeholder="e.g. 800" style={INP}/>
              </div>
              <div>
                <label style={LBL}>RT / Year *</label>
                <input type="number" value={addForm.rtYear||''} onChange={e=>setAddForm(f=>({...f,rtYear:e.target.value}))} placeholder="e.g. 156" style={INP}/>
              </div>
              <div>
                <label style={LBL}>PC / km (₹) *</label>
                <input type="number" step="0.01" value={addForm.pc||''} onChange={e=>setAddForm(f=>({...f,pc:e.target.value}))} placeholder="e.g. 58.00" style={INP}/>
              </div>
              <div>
                <label style={LBL}>MG / km (₹) *</label>
                <input type="number" step="0.01" value={addForm.mg||''} onChange={e=>setAddForm(f=>({...f,mg:e.target.value}))} placeholder="e.g. 55.00" style={INP}/>
              </div>
            </div>
            {addForm.vehicles&&addForm.rtKms&&addForm.rtYear&&!isNaN(parseInt(addForm.vehicles))&&(
              <div style={{ fontSize:11, color:'#64748b', background:'#f8fafc', padding:'6px 10px', borderRadius:5, marginBottom:12 }}>
                Contracted KMs = {parseInt(addForm.vehicles)} × {parseInt(addForm.rtYear)} × {parseFloat(addForm.rtKms).toFixed(1)} = <strong>{((parseInt(addForm.vehicles)*parseInt(addForm.rtYear)*parseFloat(addForm.rtKms))/1000).toFixed(0)}K</strong>
              </div>
            )}
            {bulkError&&<div style={{ fontSize:12, color:'#dc2626', marginBottom:10 }}>{bulkError}</div>}
            <div style={{ display:'flex', gap:8, justifyContent:'flex-end' }}>
              <button onClick={()=>{setAddModal(null);setBulkError('');}} style={CBN}>Cancel</button>
              <button onClick={addSingleLine} style={OBN}>Add Line</button>
            </div>
          </div>
        </div>
      )}

      {/* BULK IMPORT MODAL */}
      {addModal==='bulk'&&(
        <div onClick={e=>{if(e.target===e.currentTarget)setAddModal(null)}} style={{ position:'fixed', inset:0, background:'rgba(0,0,0,.5)', zIndex:200, display:'flex', alignItems:'center', justifyContent:'center', padding:20 }}>
          <div style={{ background:'#fff', borderRadius:12, padding:28, width:640, maxWidth:'100%', boxShadow:'0 20px 60px rgba(0,0,0,.3)', maxHeight:'90vh', overflowY:'auto' }}>
            <div style={{ fontSize:16, fontWeight:800, color:'#0f172a', marginBottom:6 }}>⬆ Bulk Import Lines</div>
            <div style={{ fontSize:12, color:'#64748b', marginBottom:14 }}>Paste CSV rows or upload a .csv file. Column order:</div>
            <div style={{ fontFamily:'monospace', fontSize:11, background:'#f8fafc', border:'1px solid #e2e8f0', borderRadius:6, padding:'8px 12px', marginBottom:14, color:'#374151', lineHeight:1.8 }}>
              status, code, name, partner, vehicles, region, busType, rtKms, rtYear, pc/km, mg/km<br/>
              <span style={{ color:'#94a3b8' }}>e.g. Signed,,Delhi - Agra,XYZ Travels,2,North,Sleeper,400,312,56.00,53.50</span>
            </div>
            <textarea
              value={bulkText}
              onChange={e=>{setBulkText(e.target.value);setBulkError('');}}
              rows={8}
              placeholder={"Signed,,Delhi - Agra,XYZ Travels,2,North,Sleeper,400,312,56.00,53.50\nLive,IN1234,Mumbai - Pune,ABC Travels,4,West,Sleeper,300,312,52.00,50.00"}
              style={{ width:'100%', fontFamily:'monospace', fontSize:12, padding:'8px 12px', borderRadius:6, border:'1px solid #d1d5db', resize:'vertical' }}
            />
            <div style={{ display:'flex', alignItems:'center', gap:10, margin:'10px 0' }}>
              <span style={{ fontSize:11, color:'#64748b' }}>or</span>
              <button onClick={()=>fileRef.current.click()} style={{ padding:'6px 14px', borderRadius:6, border:'1px solid #e2e8f0', background:'#fff', cursor:'pointer', fontSize:12, fontWeight:600, color:'#374151' }}>📂 Upload CSV</button>
              <input ref={fileRef} type="file" accept=".csv" style={{ display:'none' }} onChange={e=>{
                const file=e.target.files[0]; if(!file) return;
                const reader=new FileReader();
                reader.onload=ev=>{ setBulkText(ev.target.result); setBulkError(''); };
                reader.readAsText(file);
                e.target.value='';
              }}/>
            </div>
            {bulkError&&<div style={{ fontSize:12, color:'#dc2626', marginBottom:10, whiteSpace:'pre-line' }}>{bulkError}</div>}
            <div style={{ display:'flex', gap:8, justifyContent:'flex-end' }}>
              <button onClick={()=>{setAddModal(null);setBulkError('');}} style={CBN}>Cancel</button>
              <button onClick={()=>{
                if (!bulkText.trim()) { setBulkError('Please paste or upload CSV data.'); return; }
                const {results,errors}=parseBulkCSV(bulkText);
                if (errors.length&&!results.length) { setBulkError(errors.join('\n')); return; }
                setExtraLines(prev=>[...prev,...results]);
                setAddModal(null); setBulkText(''); setBulkError('');
                if (errors.length) alert(`Imported ${results.length} line(s). Skipped ${errors.length} row(s):\n${errors.join('\n')}`);
              }} style={OBN}>Import {bulkText.trim()?parseBulkCSV(bulkText).results.length:0} Lines</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

const TH = { padding:'9px 12px', textAlign:'left', fontSize:11, fontWeight:700, color:'#64748b', cursor:'pointer', userSelect:'none', whiteSpace:'nowrap', borderBottom:'1px solid #e2e8f0' };
const TD = { padding:'8px 12px', borderBottom:'1px solid #f1f5f9', fontSize:12, verticalAlign:'middle' };
const LBL = { display:'block', fontSize:11, fontWeight:700, color:'#374151', marginBottom:5, textTransform:'uppercase', letterSpacing:.3 };
const INP = { width:'100%', padding:'8px 12px', borderRadius:6, border:'1px solid #d1d5db', fontSize:13, boxSizing:'border-box' };
const CBN = { padding:'8px 18px', borderRadius:6, border:'1px solid #e2e8f0', background:'#f8fafc', cursor:'pointer', fontSize:13, fontWeight:600, color:'#374151' };
const OBN = { padding:'8px 18px', borderRadius:6, border:'none', background:'#3b82f6', color:'#fff', cursor:'pointer', fontSize:13, fontWeight:600 };

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
